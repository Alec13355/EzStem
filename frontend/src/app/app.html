<mat-toolbar color="primary">
  <img class="brand-icon" src="dahliadough-icon.svg" alt="" aria-hidden="true">
  <span class="brand-name">DahliaDough</span>
  @if (authService.isAuthenticated() && orgService.activeOrgId()) {
    <span class="active-org-chip">
      <mat-icon style="font-size:14px;height:14px;width:14px;vertical-align:middle">group</mat-icon>
      {{ orgService.activeOrgName() }}
    </span>
  }
  <span style="flex: 1;"></span>
  @if (authService.isAuthenticated()) {
    <button mat-button routerLink="/events" routerLinkActive="active">Events</button>
    <button mat-button routerLink="/pnl" routerLinkActive="active">P&amp;L</button>
    <button mat-button routerLink="/master-flowers" routerLinkActive="active">Master Flowers</button>
    <button mat-icon-button routerLink="/settings" routerLinkActive="active" title="Settings">
      <mat-icon>settings</mat-icon>
    </button>
    <button mat-icon-button (click)="signOut()" title="Sign out">
      <mat-icon>logout</mat-icon>
    </button>
  }
</mat-toolbar>

<div class="app-content">
  <router-outlet />
</div>
